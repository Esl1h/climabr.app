<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Offline — ClimaBR.app</title>
<meta name="robots" content="noindex" />
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: system-ui, sans-serif; text-align: center;
    background: #f6f9f8; color: oklch(0.18 0.015 195); }
  @media (prefers-color-scheme: dark) {
    body { background: #040f0d; color: oklch(0.92 0.005 180); }
  }
  main { max-width: 24rem; }
  strong { color: oklch(0.508 0.118 165); }
  ul { list-style: none; padding: 0; margin: 20px 0 0; }
  li { margin: 6px 0; }
  a { color: oklch(0.508 0.118 165); }
  @media (prefers-color-scheme: dark) {
    a, strong { color: oklch(0.765 0.177 163); }
  }
</style>
</head>
<body>
<main>
  <p><strong>Sem conexão</strong> e esta página não está no cache local.</p>
  <p>Se você já abriu uma cidade recentemente, ela funciona offline:</p>
  <ul>
    <li><a href="/rj/rio-de-janeiro">Rio de Janeiro/RJ</a></li>
    <li><a href="/sp/sao-paulo">São Paulo/SP</a></li>
    <li><a href="/mg/belo-horizonte">Belo Horizonte/MG</a></li>
    <li><a href="/rs/porto-alegre">Porto Alegre/RS</a></li>
  </ul>
  <p>Reconecte para atualizar ou navegar para outras cidades.</p>
</main>
</body>
</html>
