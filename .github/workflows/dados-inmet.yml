name: Coleta CPTEC/INMET (diário)

on:
  schedule:
    - cron: '0 5 * * *'   # 1x/dia (fallback CPTEC; Open-Meteo é a fonte principal)
  workflow_dispatch:
    inputs:
      estado:
        description: 'Estado para coletar (ex: sp). Deixe vazio para todos.'
        required: false
        default: ''

# Coletas não podem sobrepor: o push com lease de um snapshot antigo é
# recusado e o dado da rodada se perde. Fila global entre todos os workflows
# de coleta.
concurrency:
  group: coleta-dados
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Restaurar dados do branch dados
        run: sh scripts/dados-restaurar.sh

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Coleta previsão CPTEC
        env:
          ESTADO: ${{ github.event.inputs.estado }}
          LIMITE_MINUTOS: '25'
        run: |
          if [ -n "$ESTADO" ]; then
            if ! printf '%s' "$ESTADO" | grep -qE '^[a-z]{2}$'; then
              echo "Estado inválido (esperado 2 letras minúsculas): $ESTADO" >&2
              exit 1
            fi
            python3 scripts/scrape-inmet.py "$ESTADO"
          else
            python3 scripts/scrape-inmet.py
          fi

      - name: Publicar dados no branch dados
        if: always()
        run: |
          sh scripts/dados-publicar.sh 'dados: previsão CPTEC atualizada'
