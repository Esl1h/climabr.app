name: Coleta dados diários

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Open-Meteo — previsão, UV, qualidade do ar, sol/lua
        env:
          LIMITE_MINUTOS: '20'
        run: python3 scripts/scrape-openmeteo.py

      - name: SABESP — reservatórios SP
        run: python3 scripts/scrape-sabesp.py

      - name: COPASA — reservatórios MG
        run: python3 scripts/scrape-copasa.py
        continue-on-error: true

      # Etapa de coleta do scrape-ondas.py. A etapa "identificar" já rodou uma
      # vez e deixou data/municipios-costeiros.json com 219 municípios, mas a
      # coleta nunca chegou a ser agendada: só Santos tinha dado de ondas.
      - name: Ondas e surf (Open-Meteo Marine)
        run: python3 scripts/scrape-ondas.py
        continue-on-error: true

      - name: Dengue / Chikungunya / Zika (InfoDengue)
        env:
          LIMITE_MINUTOS: '12'
        run: python3 scripts/scrape-dengue.py
        continue-on-error: true

      - name: Alertas meteorológicos (INMET)
        run: python3 scripts/scrape-alertas.py
        continue-on-error: true

      - name: Bandeira tarifária (ANEEL)
        run: python3 scripts/scrape-bandeira.py
        continue-on-error: true

      - name: Commit dados locais (fallback)
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'dados: coleta diária (Open-Meteo, SABESP, COPASA, dengue, alertas)'
          file_pattern: 'data/cidades/**/*.json data/alertas/*.json data/bandeira.json'
          push_options: '--force-with-lease'
        continue-on-error: true
