name: Coleta de fontes municipais

# Fontes das prefeituras que não têm equivalente nacional: alagamentos do CGE em
# São Paulo e pluviômetros do Alerta Rio. As duas são leves (uma requisição
# cada), então ficam no mesmo job.
#
# O site é estático e só lê esses arquivos no build. Commits em data/cidades/**
# não disparam deploy (paths-ignore em deploy.yml), então o deploy.yml publica
# quando este workflow termina (workflow_run), sem depender de horário.
#
# Às 8h50 UTC a coleta diária (dados-diarios.yml, que começa às 8h com timeout
# de 40 min) já terminou, evitando dois commits concorrentes nos mesmos arquivos.

on:
  schedule:
    - cron: '50 8 * * *'
    - cron: '50 20 * * *'
  workflow_dispatch:
    inputs:
      data:
        description: 'Data dos alagamentos do CGE-SP (DD/MM/AAAA). Vazio = hoje.'
        required: false
        type: string

# Coletas não podem sobrepor: o push com lease de um snapshot antigo é
# recusado e o dado da rodada se perde. Fila global entre todos os workflows
# de coleta.
concurrency:
  group: coleta-dados
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Restaurar dados do branch dados
        run: sh scripts/dados-restaurar.sh

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # A data vai por env, não interpolada no run: entrada de workflow_dispatch
      # é texto livre e interpolar direto no shell abriria injeção de comando.
      - name: CGE-SP, pontos de alagamento da capital
        env:
          DATA_BUSCA: ${{ inputs.data }}
        run: python3 scripts/scrape-cgesp.py "$DATA_BUSCA"
        continue-on-error: true

      - name: Alerta Rio, chuva por bairro
        run: python3 scripts/scrape-alertario.py
        continue-on-error: true

      - name: Publicar dados no branch dados
        if: always()
        run: |
          sh scripts/dados-publicar.sh 'dados: fontes municipais (CGE-SP, Alerta Rio)'
