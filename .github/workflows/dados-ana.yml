name: Coleta ANA + INPE (diário)

on:
  schedule:
    - cron: '30 6 * * *'   # 1x/dia (reservatórios/queimadas não mudam de hora em hora)
  workflow_dispatch:

# Coletas não podem sobrepor: o push com lease de um snapshot antigo é
# recusado e o dado da rodada se perde. Fila global entre todos os workflows
# de coleta.
concurrency:
  group: coleta-dados
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Restaurar dados do branch dados
        run: sh scripts/dados-restaurar.sh

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Coleta reservatórios ANA
        run: python3 scripts/scrape-ana.py

      - name: Coleta queimadas INPE
        run: python3 scripts/scrape-inpe.py

      - name: Publicar dados no branch dados
        if: always()
        run: |
          sh scripts/dados-publicar.sh 'dados: ANA + INPE atualizados'
