name: Coleta ANA + INPE (diário)

on:
  schedule:
    - cron: '30 6 * * *'   # 1x/dia (reservatórios/queimadas não mudam de hora em hora)
  workflow_dispatch:

# Coletas não podem sobrepor: um commit com lease de checkout antigo falha
# silenciosamente (continue-on-error) e o dado da rodada se perde. Fila
# global entre todos os workflows de coleta.
concurrency:
  group: coleta-dados
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Coleta reservatórios ANA
        run: python3 scripts/scrape-ana.py

      - name: Coleta queimadas INPE
        run: python3 scripts/scrape-inpe.py

      - name: Commit dados locais (fallback)
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'dados: ANA + INPE atualizados'
          file_pattern: 'data/cidades/**/*.json'
          push_options: '--force-with-lease'
        continue-on-error: true
