name: Coleta SISAGUA (semanal)

on:
  schedule:
    - cron: '0 7 * * 0'   # domingo; qualidade da água muda devagar e o volume é alto
  workflow_dispatch:
    inputs:
      estado:
        description: 'Estado para coletar (ex: sp). Deixe vazio para rodízio.'
        required: false
        default: ''

# Coletas não podem sobrepor: o push com lease de um snapshot antigo é
# recusado e o dado da rodada se perde. Fila global entre todos os workflows
# de coleta.
concurrency:
  group: coleta-dados
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v7

      - name: Restaurar dados do branch dados
        run: sh scripts/dados-restaurar.sh

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: SISAGUA — vigilância da qualidade da água
        env:
          LIMITE_MINUTOS: '25'
        run: python3 scripts/scrape-sisagua.py ${{ inputs.estado }}

      - name: Publicar dados no branch dados
        if: always()
        run: |
          sh scripts/dados-publicar.sh 'dados: coleta SISAGUA (qualidade da água)'
