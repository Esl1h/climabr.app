name: Deploy Cloudflare Pages

on:
  # Publica depois de cada coleta que leva dado novo ao site (diária e municipal),
  # com o checkout já trazendo o commit dela. Os crons atrasam horas e por tempos
  # diferentes, então a ordem "coleta, depois deploy" não pode depender deles.
  workflow_run:
    workflows: ['Coleta dados diários', 'Coleta de fontes municipais']
    types: [completed]
  schedule:
    # Reserva, caso o gatilho acima falhe ou a coleta seja cancelada na fila
    - cron: '0 21 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'data/cidades/**'
      - 'data/alertas/**'
  workflow_dispatch:

permissions:
  contents: read

# Um build novo substitui o que está na fila: dois gatilhos juntos (coleta e
# push) não precisam de dois builds em paralelo.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Coleta cancelada na fila não trouxe dado novo
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy para Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.108.0'
          command: pages deploy dist/ --project-name=climabr-app --branch=main
