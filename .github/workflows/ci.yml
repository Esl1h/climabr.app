name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - 'data/cidades/**'
      - 'data/alertas/**'
      - 'data/bandeira.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Typecheck e build do site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck do site (astro check)
        run: npm run check

      - name: Typecheck do Worker
        run: npx tsc --noEmit -p worker/tsconfig.json

      - name: Build
        run: npm run build

  scrapers:
    name: Lint dos scrapers Python
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: check scripts/
