version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      # Atualizações de patch e minor entram juntas, para não gerar um PR por pacote
      producao:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      desenvolvimento:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
      seguranca:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
